<!-- Brief: Income view — form and table for income transactions. -->
<!-- What it does: provides UI to add new income records and edit or remove existing ones. -->
<section class="feature-page glass-card">
  <h2>Income</h2>
  <p>Track salary, freelance, investments and all GBP income sources with a cleaner daily view.</p>

  <form class="transaction-form" (ngSubmit)="addIncome()">
    <div>
      <label>Source</label>
      <input [(ngModel)]="newTransaction.source" name="incomeSource" placeholder="Source" required />
    </div>
    <div>
      <label>Category</label>
      <input [(ngModel)]="newTransaction.category" name="incomeCategory" placeholder="Category" required />
    </div>
    <div>
      <label>Date</label>
      <input type="date" [(ngModel)]="newTransaction.date" name="incomeDate" placeholder="Date" required />
    </div>
    <div>
      <label>Amount</label>
      <input type="number" min="0.01" step="0.01" [(ngModel)]="newTransaction.amount" name="incomeAmount" placeholder="Amount" required />
    </div>
    <div>
      <label>Notes</label>
      <input [(ngModel)]="newTransaction.notes" name="incomeNotes" placeholder="Notes" />
    </div>
    <div class="form-warning" *ngIf="formError">{{ formError }}</div>
    <button type="submit">Add Income</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Source</th>
        <th>Category</th>
        <th>Date</th>
        <th>Amount</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let transaction of incomeTransactions()">
        <td *ngIf="editingId !== transaction.id">{{ transaction.source }}</td>
        <td *ngIf="editingId === transaction.id">
          <input [(ngModel)]="editModel.source" name="editSource" placeholder="Source" />
        </td>
        <td *ngIf="editingId !== transaction.id">{{ transaction.category }}</td>
        <td *ngIf="editingId === transaction.id">
          <input [(ngModel)]="editModel.category" name="editCategory" placeholder="Category" />
        </td>
        <td *ngIf="editingId !== transaction.id">{{ transaction.date }}</td>
        <td *ngIf="editingId === transaction.id">
          <input type="date" [(ngModel)]="editModel.date" name="editDate" placeholder="Date" />
        </td>
        <td *ngIf="editingId !== transaction.id">{{ transaction.amount | currency:'GBP':'symbol':'1.0-0':'en-GB' }}</td>
        <td *ngIf="editingId === transaction.id">
          <input type="number" [(ngModel)]="editModel.amount" name="editAmount" placeholder="Amount" />
        </td>
        <td>
          <button *ngIf="editingId !== transaction.id" type="button" (click)="startEdit(transaction)">Edit</button>
          <button *ngIf="editingId === transaction.id" type="button" (click)="saveEdit()">Save</button>
          <button *ngIf="editingId === transaction.id" type="button" (click)="cancelEdit()">Cancel</button>
          <button type="button" (click)="deleteTransaction(transaction.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
